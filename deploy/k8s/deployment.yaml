apiVersion: apps/v1
kind: Deployment
metadata:
  name: iplocationmatch
  labels:
    app.kubernetes.io/name: iplocationmatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iplocationmatch
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iplocationmatch
    spec:
      # The server drains in-flight requests for up to 10s on SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iplocationmatch
          # Replace with your registry path and an immutable tag or digest.
          image: iplocationmatch:0.1.0
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
