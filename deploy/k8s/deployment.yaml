apiVersion: apps/v1
kind: Deployment
metadata:
  name: iplocationmatch
  labels:
    app.kubernetes.io/name: iplocationmatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iplocationmatch
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iplocationmatch
    spec:
      # Kubernetes counts this from the start of pod deletion, before the preStop hook
      # runs. It must cover the preStop sleep below (5s) plus the server's drain of
      # in-flight requests after SIGTERM (up to 10s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iplocationmatch
          # Replace with your registry path and an immutable tag or digest.
          image: iplocationmatch:0.1.0
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          lifecycle:
            preStop:
              # Keep serving for a few seconds before SIGTERM so that routes to this pod
              # are removed everywhere before the server stops accepting connections.
              # The kubelet runs this action itself (the distroless image has no
              # `sleep` binary). Tune the 5s to how long your ingress or mesh needs.
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
