apiVersion: v1
kind: Service
metadata:
  name: iplocationmatch
  labels:
    app.kubernetes.io/name: iplocationmatch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iplocationmatch
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
      # gRPC runs over HTTP/2 without TLS here; tells meshes/ingresses to use h2c.
      appProtocol: kubernetes.io/h2c
